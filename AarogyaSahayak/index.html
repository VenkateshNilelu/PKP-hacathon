<div class="container py-5">
  <h2 class="fw-bold text-primary mb-4">Patient Diagnosis Form</h2>

  <div class="card p-4 shadow-sm rounded-4">
    <form id="diagnosisForm">

      <div class="row mb-3">
        <div class="col-md-6">
          <label class="form-label">Full Name *</label>
          <input type="text" class="form-control" id="name" required />
        </div>

        <div class="col-md-3">
          <label class="form-label">Age *</label>
          <input type="number" class="form-control" id="age" required />
        </div>

        <div class="col-md-3">
          <label class="form-label">Sex *</label>
          <select id="sex" class="form-select" required>
            <option value="">Select</option>
            <option>Male</option>
            <option>Female</option>
            <option>Other</option>
          </select>
        </div>
      </div>

      <div class="row mb-3">
        <div class="col-md-4">
          <label class="form-label">Weight (kg)</label>
          <input type="number" class="form-control" id="weight" />
        </div>

        <div class="col-md-8">
          <label class="form-label">Allergies</label>
          <input type="text" class="form-control" id="allergies" />
        </div>
      </div>

      <label class="form-label fw-semibold">Describe Your Symptoms *</label>
      <textarea id="symptoms" class="form-control mb-3" rows="3" required></textarea>

      <label class="form-label fw-semibold">Common Symptoms</label>
      <div class="mb-3">
        <div class="form-check form-check-inline"><input class="form-check-input symptom-checkbox" type="checkbox" value="fever"> Fever</div>
        <div class="form-check form-check-inline"><input class="form-check-input symptom-checkbox" type="checkbox" value="cough"> Cough</div>
        <div class="form-check form-check-inline"><input class="form-check-input symptom-checkbox" type="checkbox" value="headache"> Headache</div>
        <div class="form-check form-check-inline"><input class="form-check-input symptom-checkbox" type="checkbox" value="body pain"> Body Pain</div>
      </div>

      <button class="btn btn-primary" type="submit">Generate Diagnosis</button>
      <button class="btn btn-secondary ms-2" type="reset">Clear</button>

    </form>
  </div>

  <div id="resultBox" class="card p-4 shadow-sm rounded-4 mt-4 d-none">
    <h4 class="text-primary fw-bold">Diagnosis Result</h4>
    <p id="resultText"></p>
  </div>

</div>
