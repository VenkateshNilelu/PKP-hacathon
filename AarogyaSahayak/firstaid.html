<!-- MAIN CONTENT -->
<div class="container py-5">

  <h2 class="fw-bold text-primary mb-4">Emergency First Aid Guide</h2>
  <p class="text-muted mb-4">Quick first-aid help for common health issues until professional care is available.</p>

  <div class="accordion" id="firstAidAccordion"></div>

</div>

<!-- JS -->
<script>
  async function loadFirstAid() {
    try {
      const res = await fetch("datasets/firstaid.json");
      const data = await res.json();

      const acc = document.getElementById("firstAidAccordion");
      acc.innerHTML = "";

      data.forEach((item, index) => {
        const block = document.createElement("div");
        block.className = "accordion-item shadow-sm mb-2";

        block.innerHTML = `
          <h2 class="accordion-header">
            <button class="accordion-button ${index !== 0 ? "collapsed" : ""}" 
              data-bs-toggle="collapse" 
              data-bs-target="#fa${index}">
              ${item.condition}
            </button>
          </h2>

          <div id="fa${index}" class="accordion-collapse collapse ${index === 0 ? "show" : ""}">
            <div class="accordion-body">
              <ul>
                ${item.steps.map(step => `<li>${step}</li>`).join("")}
              </ul>
            </div>
          </div>
        `;

        acc.appendChild(block);
      });

    } catch (err) {
      console.error("Error loading firstaid.json:", err);
    }
  }

  document.addEventListener("DOMContentLoaded", loadFirstAid);
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
