<!-- MAIN SECTION -->
<div class="container py-5">

  <h2 class="fw-bold text-primary mb-4">Nearby Health Centers</h2>
  <p class="text-muted mb-4">Find government-approved, affordable healthcare centers near you.</p>

  <div id="centersList" class="row g-4"></div>

</div>

<!-- JS -->
<script>
  async function loadCenters() {
    try {
      const res = await fetch("datasets/centers.json");
      const centers = await res.json();

      const container = document.getElementById("centersList");
      container.innerHTML = "";

      centers.forEach(center => {
        const card = document.createElement("div");
        card.className = "col-md-6 col-lg-4";

        card.innerHTML = `
          <div class="card shadow-sm h-100">
            <div class="card-body">
              <h5 class="card-title text-primary fw-bold">${center.name}</h5>
              <p class="card-text"><strong>Type:</strong> ${center.type}</p>
              <p class="card-text"><strong>Distance:</strong> ${center.distance} km</p>
              <p class="card-text"><strong>Services:</strong> ${center.services.join(", ")}</p>
              <p class="card-text"><strong>Contact:</strong> ${center.contact}</p>
            </div>
          </div>
        `;

        container.appendChild(card);
      });
    } catch (error) {
      console.error("Error loading centers.json:", error);
    }
  }

  document.addEventListener("DOMContentLoaded", loadCenters);
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
