<!-- MAIN CONTENT -->
<div class="container py-5">

  <h2 class="fw-bold text-primary mb-4">Affordable Diagnostic Test Costs</h2>
  <p class="text-muted">These are average diagnostic costs based on government and trusted private sources.</p>

  <div class="table-responsive mt-4">
    <table class="table table-bordered table-hover shadow-sm">
      <thead class="table-primary">
        <tr>
          <th>Test Name</th>
          <th>Average Cost (₹)</th>
          <th>Classification</th>
          <th>Recommended For</th>
        </tr>
      </thead>
      <tbody id="costTable"></tbody>
    </table>
  </div>

</div>

<!-- JS -->
<script>
  async function loadCosts() {
    try {
      const res = await fetch("datasets/costs.json");
      const costs = await res.json();

      const table = document.getElementById("costTable");
      table.innerHTML = "";

      costs.forEach(test => {
        const row = document.createElement("tr");

        row.innerHTML = `
          <td class="fw-semibold">${test.name}</td>
          <td>₹${test.cost}</td>
          <td>${test.category}</td>
          <td>${test.recommended}</td>
        `;

        table.appendChild(row);
      });

    } catch (error) {
      console.error("Error loading costs.json:", error);
    }
  }

  document.addEventListener("DOMContentLoaded", loadCosts);
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
