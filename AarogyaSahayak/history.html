<body>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg bg-white shadow-sm">
  <div class="container">
    <a class="navbar-brand fw-bold text-primary" href="index.html">🩺 Aarogya Sahayak</a>

    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navBarMenu">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="navBarMenu">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link" href="index.html">Diagnosis</a></li>

<!-- MAIN CONTENT -->
<div class="container py-5">

  <h2 class="fw-bold text-primary mb-4">Your Diagnosis History</h2>

  <div class="table-responsive">
    <table class="table table-bordered table-hover shadow-sm">
      <thead class="table-primary">
        <tr>
          <th>Date & Time</th>
          <th>Disease</th>
          <th>Confidence</th>
          <th>Severity</th>
        </tr>
      </thead>
      <tbody id="historyTable"></tbody>
    </table>
  </div>

  <button class="btn btn-danger mt-3" onclick="clearHistory()">Clear History</button>

</div>

<!-- JS -->
<script type="module">
  import { loadHistoryPage } from "./js/app.js";

  document.addEventListener("DOMContentLoaded", () => {
    loadHistoryPage();
  });

  function clearHistory() {
    localStorage.removeItem("asa_history");
    location.reload();
  }
</script>
